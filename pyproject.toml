[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vendedores-ai"
version = "0.1.0"
description = "Plataforma de agencia: fabrica de bots, planes y buscador de leads"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "anthropic>=0.40",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "itsdangerous>=2.2",
  "structlog>=24.1",
  "arq>=0.26",
  "redis>=5.0",
  "phonenumbers>=8.13",
  "holidays>=0.50",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "tenacity>=8.3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "freezegun>=1.5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/**/*", "web/static/**/*", "niches/templates/*.yaml", "ai/prompts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = ["pg: requiere Postgres real"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM"]
ignore = ["S101", "B008", "ASYNC109", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"app/leads/messages.py" = ["E501"]  # textos de WhatsApp para copiar tal cual
"tests/**" = ["S105", "S106", "S101", "S311", "S104", "E501", "SIM105", "B007", "B017"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
