{# Selector de empresa compartido por Citas y Horarios. Requiere: tenants, tenant, action, extra #}
<form class="filters" method="get" action="{{ action }}">
  <label>Empresa
    <select name="tenant_id" onchange="this.form.submit()">
      {% for t in tenants %}<option value="{{ t.id }}" {% if tenant and t.id == tenant.id %}selected{% endif %}>{{ t.name }}</option>{% endfor %}
    </select>
  </label>
  <noscript><button class="btn" type="submit">Ver</button></noscript>
</form>
