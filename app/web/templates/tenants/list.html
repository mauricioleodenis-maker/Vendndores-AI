{% extends "base.html" %}
{% block title %}Empresas{% endblock %}
{% block content %}
<h1>Empresas</h1>
<p><a class="btn btn-primary" href="/admin/negocios/nuevo">Nueva empresa</a></p>
<form class="filters" method="get" action="/admin/negocios" hx-get="/admin/negocios" hx-target="#tabla-negocios" hx-swap="outerHTML" hx-trigger="keyup changed delay:400ms from:find input, change from:find select, submit">
  <label>Buscar <input type="search" name="q" value="{{ q }}" placeholder="Nombre o ciudad"></label>
  <label>Nicho
    <select name="niche"><option value="">Todos</option>{% for n in niches %}<option value="{{ n }}" {% if n == niche %}selected{% endif %}>{{ n | nicho_es }}</option>{% endfor %}</select>
  </label>
  <label>Estado
    <select name="status"><option value="">Todos</option>{% for s in statuses %}<option value="{{ s }}" {% if s == status %}selected{% endif %}>{{ s | estado_es }}</option>{% endfor %}</select>
  </label>
  <button class="btn" type="submit">Filtrar</button>
</form>
{% include "tenants/_tabla.html" %}
{% endblock %}
