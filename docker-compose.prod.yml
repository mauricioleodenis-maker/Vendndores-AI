# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requiere DOMAIN y ACME_EMAIL en .env; POSTGRES_PASSWORD obligatorio.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
  migrate:
    environment:
      VAI_ENV: prod
      VAI_DATABASE_URL: postgresql+asyncpg://vendedores:${POSTGRES_PASSWORD:?}@db:5432/vendedores
  web:
    ports: !reset []
    expose: ["8000"]
    environment:
      VAI_ENV: prod
      VAI_DATABASE_URL: postgresql+asyncpg://vendedores:${POSTGRES_PASSWORD:?}@db:5432/vendedores
      VAI_COOKIE_SECURE: "true"
      VAI_DEBUG: "false"
    read_only: true
    tmpfs: ["/tmp"]
  worker:
    environment:
      VAI_ENV: prod
      VAI_DATABASE_URL: postgresql+asyncpg://vendedores:${POSTGRES_PASSWORD:?}@db:5432/vendedores
    read_only: true
    tmpfs: ["/tmp"]
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
