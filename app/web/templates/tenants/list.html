{% extends "base.html" %}
{% block title %}Empresas{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Empresas</h1>
  <div class="page-actions"><a class="btn btn-primary" href="/admin/negocios/nuevo">Nueva empresa</a></div>
</div>
<form class="card table-toolbar form-grid" method="get" action="/admin/negocios" hx-get="/admin/negocios" hx-target="#tabla-negocios" hx-swap="outerHTML" hx-indicator="#ld-empresas" hx-trigger="keyup changed delay:400ms from:find input, change from:find select, submit">
  <div class="field"><label for="f-q">Buscar</label><input id="f-q" type="search" name="q" value="{{ q }}" placeholder="Nombre o ciudad"></div>
  <div class="field"><label for="f-niche">Nicho</label>
    <select id="f-niche" name="niche"><option value="">Todos</option>{% for n in niches %}<option value="{{ n }}" {% if n == niche %}selected{% endif %}>{{ n | nicho_es }}</option>{% endfor %}</select>
  </div>
  <div class="field"><label for="f-status">Estado</label>
    <select id="f-status" name="status"><option value="">Todos</option>{% for s in statuses %}<option value="{{ s }}" {% if s == status %}selected{% endif %}>{{ s | estado_es }}</option>{% endfor %}</select>
  </div>
  <div class="btn-row"><button class="btn" type="submit">Filtrar</button><span class="htmx-indicator inline" id="ld-empresas">Cargando…</span></div>
</form>
{% include "tenants/_tabla.html" %}
{% endblock %}
