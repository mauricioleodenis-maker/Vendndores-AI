name: vendedores-ai

x-app: &app
  build: .
  image: vendedores-ai:latest
  env_file: .env
  environment: &app-env
    VAI_DATABASE_URL: postgresql+asyncpg://vendedores:${POSTGRES_PASSWORD:-vendedores}@db:5432/vendedores
    VAI_REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  pids_limit: 512
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vendedores
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vendedores}
      POSTGRES_DB: vendedores
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendedores -d vendedores"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    ports:
      # Solo loopback: en dev no se expone a la red. En prod lo atiende Caddy.
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["arq", "app.worker.WorkerSettings"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
