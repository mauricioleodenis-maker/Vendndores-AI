name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" pip-audit bandit
      - run: ruff check .
      - run: ruff format --check app tests alembic
      - run: pytest --cov=app --cov-report=term-missing
      - run: bandit -q -r app -ll
      - run: pip-audit
  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t vendedores-ai:ci .
      - name: Validar compose
        run: |
          cp .env.example .env
          docker compose config -q
          POSTGRES_PASSWORD=ci DOMAIN=example.com ACME_EMAIL=ci@example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
