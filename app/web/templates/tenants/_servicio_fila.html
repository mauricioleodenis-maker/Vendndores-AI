<div class="form-grid card card-flat" role="group" aria-label="Servicio">
  <div class="field span-2"><label>Servicio <input name="service_name" value="{{ s.get('name', '') }}" maxlength="200" placeholder="Ej. Limpieza dental"></label></div>
  <div class="field"><label>Precio COP <input name="service_price" inputmode="numeric" value="{{ s.get('price_cop') if s.get('price_cop') is not none else '' }}" placeholder="Sin precio"></label></div>
  <div class="field"><label>Duración (min) <input name="service_duration" inputmode="numeric" value="{{ s.get('duration_min', 30) }}"></label></div>
</div>
